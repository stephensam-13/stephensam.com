        .hub-layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 2rem;

            align-items: start;
        }
        .hub-sidebar {
            background: var(--bg-card);

            border-radius: var(--radius-lg);

            display: block;

        .hub-topic-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .hub-topic-btn {

            background: rgba(255, 255, 255, 0.02);

            border-radius: 10px;
            padding: 0.8rem 0.9rem;

            cursor: pointer;
            transition: var(--transition);

            flex-direction: column;
            gap: 0.2rem;

        .hub-topic-btn:hover {

        }
        .hub-topic-btn.active {

            border-color: var(--accent-emerald);
        }
        .hub-topic-tag {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--accent-cyan);
        }
        .hub-topic-name {
            font-family: var(--font-display);
            font-size: 0.92rem;
            font-weight: 600;
        }
        .hub-article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
        }
        .hub-article-card h1 {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 2.8vw, 2.25rem);
            margin-bottom: 0.5rem;
        }
        .hub-meta {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .hub-article-card h3 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--text-primary);
            margin: 1.85rem 0 0.75rem;
        }
        .hub-article-card p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .hub-article-card ul {
            margin: 0 0 1.25rem 1.25rem;
            color: var(--text-secondary);
        }
        .hub-article-card li {
            list-style: disc;
            margin-bottom: 0.45rem;
        }
        .hub-article-card code {
            font-family: var(--font-mono);
            font-size: 0.84rem;
            background: rgba(16, 185, 129, 0.12);
            color: #a7f3d0;
            padding: 0.15rem 0.4rem;
            border-radius: 5px;
        }
        .hub-article-card pre {
            background: #050811;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.1rem;
            overflow-x: auto;
            margin: 1rem 0 1.5rem;
        }
        .hub-article-card pre code {
            background: transparent;
            padding: 0;
            color: #a7f3d0;
        }
        @media (max-width: 900px) {

                grid-template-columns: 1fr;

<body>

            <a href="../index.html" class="brand">

            <div class="nav-actions">

                </a>
                <a href="https://www.youtube.com/@stephen.sam13" target="_blank" rel="noopener" class="btn btn-yt-nav">
                    <i class="fab fa-youtube"></i> <span>DevOps Malayalam</span>

    <main class="container">
        <div class="hub-layout">
            <aside class="hub-sidebar">

                <div class="hub-topic-list" id="topicList">
                    <button class="hub-topic-btn active" data-id="linux-q1">
                        <span class="hub-topic-tag">MODULE 01 · LINUX &amp; SRE</span>
                        <span class="hub-topic-name">Linux Fundamentals &amp; L3 Process Triage</span>
                    </button>
                    <button class="hub-topic-btn" data-id="aws-q1">
                        <span class="hub-topic-tag">MODULE 02 · AWS CLOUD</span>
                        <span class="hub-topic-name">Understanding EC2 Instances, AMIs &amp; CLI Automation</span>
                    </button>
                    <button class="hub-topic-btn" data-id="terraform-q1">

    <footer class="site-footer">

            <div class="footer-brand">
                <span class="brand-prompt">&gt;_</span>
                <strong>stephensam.com</strong>
                <span class="footer-sep">·</span>
                <span>Practical DevOps &amp; Cloud Interview Hub</span>
            </div>
            <p class="footer-copy">&copy; 2026 Stephen Sam.</p>
        </div>
    </footer>

    <script>
        const articles = {
            "linux-q1": {
                tag: "MODULE 01 · LINUX & SRE",
                title: "Mastering Linux Fundamentals & L3 Process Triage for DevOps Interviews",
                published: "Updated for 2026 · RHCSA Track",
                content: `
                    <p>Every strong DevOps or Site Reliability Engineer starts with deep Linux fluency. In production L3 troubleshooting and technical interviews, you are rarely asked theoretical definitions—you are given a slow or failing node and asked to diagnose it in the terminal.</p>

                    <h3>1. File System &amp; Permission Auditing</h3>
                    <p>Essential commands to navigate and verify service configurations:</p>
                    <ul>
                        <li><code>pwd</code> &amp; <code>ls -la</code>: Inspect working directories, hidden files, and POSIX ownership/permissions.</li>
                        <li><code>df -h</code> &amp; <code>du -sh *</code>: Rapidly isolate disk capacity exhaustion or runaway log files.</li>
                    </ul>
                    <pre><code># Check disk usage and find largest directories under /var/log
df -h
du -sh /var/log/* | sort -hr | head -n 10</code></pre>

                    <h3>2. Process &amp; Resource Management</h3>
                    <p>When an application experiences high latency or CPU throttling, inspect active processes and system load:</p>
                    <ul>
                        <li><code>ps aux --sort=-%cpu</code>: Snapshot top CPU-consuming processes.</li>
                        <li><code>top</code> / <code>htop</code>: Real-time process and load average telemetry.</li>
                        <li><code>kill -15 &lt;PID&gt;</code>: Send graceful <code>SIGTERM</code> before resorting to <code>kill -9</code> (<code>SIGKILL</code>).</li>
                    </ul>
                    <pre><code>ps aux | grep nginx
systemctl status nginx --no-pager
journalctl -u nginx --since "15 minutes ago"</code></pre>

                    <h3>3. Networking &amp; Socket Verification</h3>
                    <ul>
                        <li><code>ip addr</code>: Inspect network interfaces and CIDR bindings.</li>
                        <li><code>ss -tulpn</code>: Verify which process is listening on TCP/UDP ports.</li>
                        <li><code>curl -Iv https://stephensam.com</code>: Validate TLS handshake and HTTP response headers.</li>
                    </ul>
                `
            },
            "aws-q1": {
                tag: "MODULE 02 · AWS CLOUD",
                title: "AWS EC2 Instances, AMIs & CLI Automation in Production",
                published: "Updated for 2026 · AWS Cloud Track",
                content: `
                    <p>Amazon Elastic Compute Cloud (EC2) and Amazon Machine Images (AMIs) form the compute backbone of AWS cloud workloads. In modern DevOps environments, we treat instances as immutable cattle baked from golden AMIs rather than hand-configured pets.</p>

                    <h3>1. What is an AMI &amp; Why Golden Images Matter?</h3>
                    <p>An Amazon Machine Image (AMI) defines the root volume template (OS, hardened kernel packages, monitoring agents) and block device mappings required to launch an EC2 instance deterministically across Auto Scaling Groups.</p>

                    <h3>2. Querying &amp; Auditing AMIs with AWS CLI</h3>
                    <pre><code># List custom AMIs owned by your account sorted by creation date
aws ec2 describe-images \\
  --owners self \\
  --query "reverse(sort_by(Images, &CreationDate))[*].{ID:ImageId,Name:Name,Date:CreationDate}" \\
  --output table</code></pre>

                    <h3>3. Production Checklist for EC2 Workloads</h3>
                    <ul>
                        <li>Enforce <strong>IMDSv2</strong> (Instance Metadata Service v2) on all instances.</li>
                        <li>Attach least-privilege <strong>IAM Instance Profiles</strong> instead of static AWS keys.</li>
                        <li>Provision completely via <strong>Terraform</strong> or CloudFormation.</li>
                    </ul>
                `
            },
            "terraform-q1": {
                tag: "MODULE 03 · TERRAFORM IAC",
                title: "Static Site Hosting on AWS S3 + CloudFront + ACM SSL with Terraform",
                published: "Updated for 2026 · Terraform Zero-to-Hero Track",
                content: `
                    <p>Hosting a static portfolio or documentation portal directly from a public S3 website endpoint exposes insecure HTTP traffic and higher latency. The production pattern pairs a <strong>private S3 bucket</strong> with <strong>Amazon CloudFront</strong> and an <strong>AWS Certificate Manager (ACM)</strong> TLS certificate.</p>

                    <h3>Architecture Highlights</h3>
                    <ul>
                        <li><strong>Private S3 Origin</strong>: Block all public S3 access; only CloudFront Origin Access Control (OAC) can read objects.</li>
                        <li><strong>Free Automated TLS</strong>: Provision an ACM certificate in <code>us-east-1</code> with DNS validation.</li>
                        <li><strong>CI/CD Sync</strong>: Automatically deploy updates via GitHub Actions on every push to <code>main</code>.</li>
                    </ul>
                    <pre><code># Initialize and apply the Terraform stack
terraform init
terraform plan -out=prod.tfplan
terraform apply "prod.tfplan"</code></pre>
                    <p><a href="https://medium.com/@stephensam13/host-a-static-html-site-on-s3-with-free-ssl-using-cloudfront-acm-terraform-fe303e660d85" target="_blank" rel="noopener" class="btn btn-primary btn-sm" style="margin-top:0.5rem;">Read Full Step-by-Step Guide on Medium <i class="fas fa-arrow-up-right-from-square"></i></a></p>
                `
            }
        };

        const container = document.getElementById("articleContent");
        const buttons = document.querySelectorAll(".hub-topic-btn");

        function renderArticle(id) {
            const key = articles[id] ? id : "linux-q1";
            const item = articles[key];
            document.getElementById("articleTitle").textContent = `${item.title} — Stephen Sam`;

            buttons.forEach(b => b.classList.toggle("active", b.getAttribute("data-id") === key));

            container.innerHTML = `
                <span class="section-eyebrow"><i class="fas fa-terminal"></i> ${item.tag}</span>
                <h1>${item.title}</h1>
                <div class="hub-meta">
                    <span><i class="far fa-clock"></i> ${item.published}</span>
                    <span><i class="fas fa-user-check"></i> By Stephen Sam</span>
                </div>
                ${item.content}
            `;
        }

        const params = new URLSearchParams(window.location.search);
        renderArticle(params.get("id") || "linux-q1");

        buttons.forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                history.replaceState(null, "", `?id=${id}`);
                renderArticle(id);
            });
        });
    </script>
</body>
